<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#b91d2c">
    <title>モンスターメーカー</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <p class="eyebrow">ORIGINAL MONSTER DATABASE</p>
        <h1>モンスターメーカー</h1>
        <p>未知のモンスターをスキャンして、能力データを生成しよう。</p>
      </header>

      <section class="control-panel" aria-labelledby="generator-heading">
        <div>
          <p class="section-number">GENERATOR / 01</p>
          <h2 id="generator-heading">合計種族値を設定</h2>
        </div>
        <label class="total-field" for="total-input">
          <span>合計種族値</span>
          <input id="total-input" type="number" min="300" max="720" step="1" value="500" inputmode="numeric">
          <small>300〜720の整数</small>
        </label>
        <p id="input-error" class="error" role="alert" aria-live="polite"></p>
        <button id="generate-button" type="button">
          <span aria-hidden="true">●</span> ポケモンを生成
        </button>
      </section>

      <section id="result-card" class="result-card" aria-labelledby="monster-name" aria-live="polite">
        <div class="card-topline">
          <span>SCAN RESULT</span><span id="entry-number">NO. 000</span>
        </div>
        <div class="identity">
          <div>
            <p class="label">NAME</p>
            <h2 id="monster-name">---</h2>
          </div>
          <div id="type-list" class="type-list" aria-label="タイプ"></div>
        </div>
        <div class="archetype-row">
          <span class="label">BATTLE STYLE / 型</span>
          <strong id="archetype">---</strong>
        </div>
        <div class="stats-heading">
          <div><p class="section-number">BASE STATS / 02</p><h3>種族値データ</h3></div>
          <div class="total-badge"><span>合計</span><strong id="display-total">---</strong></div>
        </div>
        <div id="stats-list" class="stats-list"></div>
        <div class="scale" aria-hidden="true"><span>0</span><span>50</span><span>100</span><span>150</span><span>180</span></div>
      </section>
      <footer>FAN-MADE ORIGINAL MONSTER GENERATOR</footer>
    </main>
    <script src="app.js"></script>
  </body>
</html>
